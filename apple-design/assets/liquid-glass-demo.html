<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%2331546b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23d7e9e3'/%3E%3C/svg%3E">
  <title>Apple Design · 玻璃材质示例</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2c3a; background: #f7f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #155ea7; outline-offset: 4px; }
    .page { max-width: 1160px; margin: auto; padding: 48px 40px 32px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 30px; }
    .eyebrow { font-size: .75rem; letter-spacing: .12em; color: #566575; margin: 0 0 14px; }
    h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 600; line-height: 1.2; margin: 0; }
    .intro > p { max-width: 21em; color: #536372; line-height: 1.7; margin: 0; }
    .scene { --sky: #d7e9e3; --sun: #ffe6b7; --mountain: #678e91; --near: #315b70; --water: #b2ced1; --ink: #203d4c;
      position: relative; isolation: isolate; height: 570px; overflow: hidden; border-radius: 28px; background: var(--sky); }
    .scene[data-scene="evening"] { --sky: #ebd3d7; --sun: #ffe7d3; --mountain: #a084a4; --near: #5a5a86; --water: #b4abc9; --ink: #3d3258; }
    .scene[data-scene="night"] { --sky: #253b61; --sun: #aabbd8; --mountain: #314864; --near: #142d47; --water: #487194; --ink: #edf3ff; }
    .landscape { position: absolute; inset: 0; pointer-events: none; }
    .sky { position: absolute; inset: 0; background: radial-gradient(ellipse at 66% 34%, var(--sun) 0%, transparent 39%), linear-gradient(180deg, transparent 45%, var(--water)); }
    .sun { position: absolute; width: 108px; height: 108px; border-radius: 50%; top: 92px; left: 62%; background: var(--sun); box-shadow: 0 0 90px 35px var(--sun); }
    .ridge { position: absolute; width: 105%; height: 78%; left: -24%; bottom: -31%; border-radius: 42%; background: linear-gradient(140deg, var(--mountain), var(--near)); transform: rotate(22deg) translateX(var(--shift, 0px)); }
    .ridge.near { left: 39%; bottom: -42%; width: 100%; background: linear-gradient(125deg, var(--near), var(--mountain)); transform: rotate(-23deg) translateX(var(--shift, 0px)); }
    .contour { position: absolute; top: 39%; left: 12%; width: 71%; height: 37%; border-top: 1px solid rgb(255 255 255 / .55); border-bottom: 1px solid rgb(255 255 255 / .2); border-radius: 50%; transform: rotate(-12deg); }
    .scene-copy { position: absolute; left: 40px; top: 167px; color: var(--ink); }
    .scene-copy p { margin: 0 0 12px; font-size: .75rem; letter-spacing: .13em; }
    .scene-copy h2 { font-size: clamp(2.25rem, 5vw, 4rem); font-weight: 500; line-height: 1.2; margin: 0; }
    .coordinates { position: absolute; bottom: 28px; left: 32px; margin: 0; color: #fff; font-size: .75rem; letter-spacing: .08em; }
    .glass { position: relative; color: #172536; background: rgb(255 255 255 / .91); border: 1px solid rgb(255 255 255 / .78); box-shadow: 0 10px 36px rgb(17 33 52 / .17), inset 0 1px 0 rgb(255 255 255 / .8); border-radius: 999px; }
    @supports (backdrop-filter: blur(1px)) {
      .glass { background: rgb(255 255 255 / .56); backdrop-filter: blur(16px) saturate(125%); }
    }
    .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(circle at var(--light-x, 50%) var(--light-y, 0%), rgb(255 255 255 / .5), transparent 65%); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 24px; padding: 8px 10px 8px 22px; }
    .brand { position: relative; font-size: .9rem; font-weight: 600; }
    .choices { display: flex; position: relative; gap: 2px; padding: 2px; }
    .selection { position: absolute; top: 2px; left: 2px; height: calc(100% - 4px); width: 72px; border-radius: 999px; background: rgb(255 255 255 / .88); box-shadow: 0 1px 4px rgb(20 32 54 / .09); pointer-events: none; }
    .choices button { position: relative; min-width: 72px; min-height: 44px; border: 0; border-radius: 999px; background: transparent; color: #26374b; transition: transform 110ms ease-out; }
    .choices button[aria-pressed="true"] { color: #102a4b; font-weight: 600; }
    .choices button:active { transform: scale(.94); }
    .caption { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 18px 0 30px; font-size: .8rem; color: #536372; }
    .caption p { margin: 0; }
    .preferences { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); gap: 24px; border-top: 1px solid #dce1dd; padding-top: 22px; }
    .range-control { display: grid; gap: 12px; font-size: .85rem; }
    .range-control label { display: flex; justify-content: space-between; gap: 12px; }
    input[type="range"] { width: 100%; accent-color: #32546b; }
    .toggle { display: flex; align-items: center; gap: 10px; font-size: .85rem; min-height: 44px; }
    .toggle input { width: 18px; height: 18px; accent-color: #32546b; }
    body[data-contrast="true"] .glass { background: #fff; border-color: #26374b; backdrop-filter: none; box-shadow: 0 5px 22px rgb(17 33 52 / .2); }
    body[data-contrast="true"] .glass::before { display: none; }
    body[data-contrast="true"] .selection { border: 1px solid #26374b; }
    body[data-motion="reduce"] .choices button { transition: none; }
    body[data-motion="reduce"] .glass::before { background: linear-gradient(rgb(255 255 255 / .2), transparent); }
    @media (prefers-reduced-transparency: reduce) { .glass { background: #fff; backdrop-filter: none; } .glass::before { display: none; } }
    @media (prefers-contrast: more) { .glass { background: #fff; border-color: #26374b; backdrop-filter: none; } .glass::before { display: none; } }
    @media (prefers-reduced-motion: reduce) { .choices button { transition: none; } .glass::before { background: linear-gradient(rgb(255 255 255 / .2), transparent); } }
    @media (max-width: 680px) {
      .page { padding: 30px 18px; }
      .intro { display: block; } .intro > p { margin-top: 18px; }
      .scene { height: 480px; border-radius: 22px; }
      .toolbar { margin: 16px; padding: 7px 8px; justify-content: center; }
      .brand { display: none; } .choices button { min-width: 68px; }
      .scene-copy { left: 26px; top: 140px; } .coordinates { left: 24px; }
      .preferences { grid-template-columns: 1fr; gap: 12px; }
      .caption { align-items: start; flex-direction: column; gap: 7px; }
    }
  </style>
</head>
<body data-motion="full" data-contrast="false">
  <main class="page">
    <header class="intro">
      <div><p class="eyebrow">APPLE DESIGN / MATERIAL STUDY</p><h1>让内容透出来。</h1></div>
      <p>切换背景，轻按控件。观察玻璃上的光，以及始终清楚的操作。</p>
    </header>
    <section class="scene" data-scene="morning" aria-label="山水场景">
      <div class="landscape" aria-hidden="true"><div class="sky"></div><div class="sun"></div><div class="ridge"></div><div class="ridge near"></div><div class="contour"></div></div>
      <div class="scene-copy"><p id="scene-label">01 / MORNING LIGHT</p><h2 id="scene-title">山水之间</h2></div>
      <div class="toolbar glass">
        <span class="brand">光与界面</span>
        <div class="choices" role="group" aria-label="选择背景">
          <span class="selection" aria-hidden="true"></span>
          <button type="button" data-value="morning" aria-pressed="true">晨光</button>
          <button type="button" data-value="evening" aria-pressed="false">暮色</button>
          <button type="button" data-value="night" aria-pressed="false">夜色</button>
        </div>
      </div>
      <p class="coordinates">静一点，也清楚一点。</p>
    </section>
    <div class="caption"><p>网页玻璃近似示例，未包含背景折射。</p><p>无需安装 · 可直接打开</p></div>
    <div class="preferences" role="group" aria-label="演示设置">
      <div class="range-control"><label for="position">背景位置 <output for="position" id="position-value">50%</output></label><input type="range" id="position" min="0" max="100" value="50"></div>
      <label class="toggle"><input type="checkbox" id="reduce-motion">减少动态效果</label>
      <label class="toggle"><input type="checkbox" id="increase-contrast">提高对比度</label>
    </div>
  </main>
  <script>
    // 网页近似：真实 backdrop blur + 高光；没有折射或系统级光照。
    // 弹簧由当前位置、速度演进；重定向只改目标，不重置速度。
    const scene = document.querySelector('.scene');
    const toolbar = document.querySelector('.toolbar');
    const choices = document.querySelector('.choices');
    const buttons = [...choices.querySelectorAll('button')];
    const selection = document.querySelector('.selection');
    const motionToggle = document.querySelector('#reduce-motion');
    const contrastToggle = document.querySelector('#increase-contrast');
    const position = document.querySelector('#position');
    const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    const contrastPreference = matchMedia('(prefers-contrast: more)');
    const transparencyPreference = matchMedia('(prefers-reduced-transparency: reduce)');
    const state = { x: 0, velocity: 0, target: 0, frame: 0, previousTime: 0 };
    let activeIndex = 0;
    const scenes = {
      morning: ['01 / MORNING LIGHT', '山水之间'],
      evening: ['02 / EVENING GLOW', '晚风有信'],
      night: ['03 / NIGHTFALL', '静候星光']
    };
    const reduced = () => motionPreference.matches || motionToggle.checked;
    function render() { selection.style.transform = `translateX(${state.x}px)`; }
    function settle() {
      cancelAnimationFrame(state.frame);
      state.frame = 0;
      state.velocity = 0;
      state.x = state.target;
      render();
    }
    function step(time) {
      // 将有限的帧间隔拆成小步，避免后台恢复和低帧率时数值爆炸。
      let remaining = Math.min(Math.max((time - state.previousTime) / 1000, 0), .05);
      state.previousTime = time;
      while (remaining > 0) {
        const dt = Math.min(remaining, 1 / 240);
        const acceleration = -225 * (state.x - state.target) - 30 * state.velocity;
        state.velocity += acceleration * dt;
        state.x += state.velocity * dt;
        remaining -= dt;
      }
      render();
      if (Math.abs(state.x - state.target) < .04 && Math.abs(state.velocity) < .1) settle();
      else state.frame = requestAnimationFrame(step);
    }
    function moveSelection(immediate = false) {
      const button = buttons[activeIndex];
      state.target = button.offsetLeft - 2;
      selection.style.width = `${button.offsetWidth}px`;
      if (immediate || reduced()) settle();
      else if (!state.frame) {
        state.previousTime = performance.now();
        state.frame = requestAnimationFrame(step);
      }
    }
    buttons.forEach((button, index) => button.addEventListener('click', () => {
      activeIndex = index;
      buttons.forEach((item, i) => item.setAttribute('aria-pressed', String(i === index)));
      scene.dataset.scene = button.dataset.value;
      const [label, title] = scenes[button.dataset.value];
      document.querySelector('#scene-label').textContent = label;
      document.querySelector('#scene-title').textContent = title;
      moveSelection();
    }));
    toolbar.addEventListener('pointermove', event => {
      if (reduced() || event.pointerType === 'touch') return;
      const bounds = toolbar.getBoundingClientRect();
      toolbar.style.setProperty('--light-x', `${(event.clientX - bounds.left) / bounds.width * 100}%`);
      toolbar.style.setProperty('--light-y', `${(event.clientY - bounds.top) / bounds.height * 100}%`);
    });
    toolbar.addEventListener('pointerleave', () => {
      toolbar.style.removeProperty('--light-x');
      toolbar.style.removeProperty('--light-y');
    });
    position.addEventListener('input', () => {
      scene.style.setProperty('--shift', `${(Number(position.value) - 50) * 1.3}px`);
      document.querySelector('#position-value').textContent = `${position.value}%`;
    });
    function updatePreferences() {
      document.body.dataset.motion = reduced() ? 'reduce' : 'full';
      document.body.dataset.contrast = String(contrastPreference.matches || transparencyPreference.matches || contrastToggle.checked);
      if (reduced()) settle();
    }
    motionToggle.addEventListener('change', updatePreferences);
    contrastToggle.addEventListener('change', updatePreferences);
    motionPreference.addEventListener('change', updatePreferences);
    contrastPreference.addEventListener('change', updatePreferences);
    transparencyPreference.addEventListener('change', updatePreferences);
    new ResizeObserver(() => moveSelection(true)).observe(choices);
    addEventListener('pagehide', () => cancelAnimationFrame(state.frame));
    updatePreferences();
    moveSelection(true);
  </script>
</body>
</html>
